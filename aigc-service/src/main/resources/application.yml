# ==================== 视频服务 ====================
server:
  port: 1000
spring:
  # 激活 local profile：Spring Boot 会自动加载同目录下的 application-local.yml，
  # 且 profile 专属配置的优先级高于本文件，用于存放不能提交进仓库的本地密钥。
  profiles:
    active: local
    # Elasticsearch 配置
  elasticsearch:
    uris: http://127.0.0.1:19200

  application:
    name: aigc-service
  # SpringBoot3 核心必填，导入nacos公共配置
  config:
    import:
      - aigc-service.yaml
      # optional: nacos连不上也能启动；依次写所有公共dataId
      - optional:nacos:common-redis.yml?refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
      discovery:
        server-addr: localhost:8848   # Nacos 注册中心地址
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_aigc?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  ai:
    chat:
      max-messages: 100
    dashscope:
      # ⚠️ API Key 不写在本文件里，也不提交进仓库（本文件受 git 追踪）。
      # 真实值放在同目录的 application-local.yml：它被 .gitignore 忽略，
      # 并由上面的 local profile 覆盖到此字段；换机器/新克隆时需自行创建该文件。
      # 若想改用环境变量，把下一行替换为：api-key: ${DASHSCOPE_API_KEY:}
      # api-key: <本地值见 application-local.yml>
      chat:
        options:
          model: qwen-max
      embedding:
        enabled: true
        options:
          model: text-embedding-v3
          dimensions: 1024
    #          向量库配置
    vectorstore:
      # redis向量库配置
      redis:
        initialize-schema: true
        index-name: custom-index
        prefix: custom-prefix
        #es向量库配置
      elasticsearch:
        initialize-schema: true
        dimensions: 1024



mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
lyy:
  ai:
    prompt:
      system:
        chat:
          data-id: system-chat-message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000