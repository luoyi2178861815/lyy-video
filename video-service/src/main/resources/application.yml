# ==================== 视频服务 ====================
server:
  port: 8002

spring:
  application:
    name: video-service
  # SpringBoot3 核心必填，导入nacos公共配置
  config:
    import:
      # optional: nacos连不上也能启动；依次写所有公共dataId
      - optional:nacos:common-redis.yml?refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
      discovery:
        server-addr: localhost:8848   # Nacos 注册中心地址
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /


mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.lyy.video.entity.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
