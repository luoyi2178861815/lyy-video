# ==================== 网关服务（端口 8000） ====================
server:
  port: 8001

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848    # Nacos 注册中心地址
    gateway:
      # 全局跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:

        # ========== 管理端 - 视频服务（顺序敏感，必须排在下面的 /api/admin/** 通配之前） ==========
        - id: admin-video-service
          uri: lb://video-service
          predicates:
            - Path=/api/admin/video/**
          filters:
            - AdminAuth                     # 必须排在 StripPrefix 之前，见上文说明
            - StripPrefix=1                 # /api/admin/video/page → /admin/video/page
        # ========== 管理端 - 用户服务（含登录，通配接住 user-service 内所有后台模块） ==========
        - id: admin-user-service
          uri: lb://user-service
          predicates:
            - Path=/api/admin/**
          filters:
            - AdminAuth                     # 必须排在 StripPrefix 之前，见上文说明
            - StripPrefix=1                 # /api/admin/login → /admin/login
        # ========== 用户服务路由 ==========
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        # ========== 视频服务路由 ==========
        - id: video-service
          uri: lb://video-service
          predicates:
            - Path=/api/video/**
          filters:
            - StripPrefix=1
        # ========== 互动服务路由 ==========
        - id: interaction-service
          uri: lb://interaction-service
          predicates:
            - Path=/api/interact/**
          filters:
            - StripPrefix=1
        # ========== 推荐服务路由 ==========

        - id: recommend-service
          uri: lb://recommend-service
          predicates:
            - Path=/api/recommend/**
          filters:
            - StripPrefix=1
            # ========== ai服务路由 ==========
        - id: aigc-service
          uri: lb://aigc-service
          predicates:
            - Path=/api/aigc/**
          filters:
            - StripPrefix=2


