# ==================== 互动服务 ====================
server:
  port: 12000

spring:
  application:
    name: interaction-service
  # SpringBoot3 核心必填，导入nacos公共配置
  config:
    import:
      # optional: nacos连不上也能启动；依次写所有公共dataId
      - optional:nacos:common-redis.yml?refreshEnabled=true
      - optional:nacos:sentinel-common.yml?refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
      discovery:
        server-addr: localhost:8848    # Nacos 注册中心地址
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_interaction?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai

    username: root
    password: 123456
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000  # 连接超时时间
        readTimeout: 10000    # 读取超时时间
  httpclient:
    enabled: true
    max-connections: 200
    max-connections-per-route: 50
